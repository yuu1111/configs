name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build npm tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx biome check .

      - name: Select package
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$RELEASE_TAG" in
            biome-config-v*)
              package_dir="packages/biome-config"
              release_version="${RELEASE_TAG#biome-config-v}"
              ;;
            tsconfig-v*)
              package_dir="packages/tsconfig"
              release_version="${RELEASE_TAG#tsconfig-v}"
              ;;
            *)
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          package_version="$(node -p "require('./$package_dir/package.json').version")"
          test "$package_version" = "$release_version"
          echo "package-dir=$package_dir" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package-dir }}
        run: npm pack "./$PACKAGE_DIR" --dry-run --ignore-scripts

      - name: Build package tarball
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.package-dir }}
        run: |
          mkdir package
          npm pack "./$PACKAGE_DIR" --pack-destination package --ignore-scripts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # Mint the short-lived OIDC token used by npm Trusted Publisher.

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: package

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish exactly one tarball
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./package/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --provenance --access public --ignore-scripts
